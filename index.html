<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>corpoarquivo.</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #dedfe1;
            color: #151515;
            font-family: Georgia, "Times New Roman", serif;
        }

        .site {
            display: grid;
            grid-template-columns: 28% 72%;
            min-height: 100vh;
        }

        /* COLUNA ESQUERDA */

        .menu {
            padding: 45px 100px;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* LOGO */

        .logo {
            font-size: 60px;
            font-weight: normal;
            margin-bottom: 65px;
        }

        /* MENU PRINCIPAL */

        nav {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        nav a {
            color: #151515;
            text-decoration: none;
            font-size: 36px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* MENU INFERIOR */

        .secondary-menu {
            margin-top: auto;
            padding-top: 40px;

            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .secondary-menu a {
            color: #151515;
            text-decoration: none;
            font-size: 36px;
        }

        .secondary-menu a:hover {
            text-decoration: underline;
        }

        /* SHARE */

        .share {
            position: fixed;
            right: 100px;
            bottom: 45px;
        }

        .share button {
            background: none;
            border: none;
            padding: 0;
            margin: 0;

            color: #151515;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 36px;

            cursor: pointer;
        }

        .share button:hover {
            text-decoration: underline;
        }

        /* MENU DE PARTILHA */

        .share-menu {
            display: none;

            position: absolute;
            right: 0;
            bottom: 55px;

            min-width: 180px;

            background: #dedfe1;
            border: 1px solid #151515;

            padding: 15px 20px;
        }

        .share-menu.active {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .share-menu a,
        .share-menu button {
            color: #151515;
            text-decoration: none;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 20px;

            background: none;
            border: none;
            padding: 0;

            text-align: left;
            cursor: pointer;
        }

        .share-menu a:hover,
        .share-menu button:hover {
            text-decoration: underline;
        }

        /* ÁREA PRINCIPAL */

        .main {
            min-height: 100vh;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .site {
                grid-template-columns: 1fr;
            }

            .menu {
                padding: 30px 35px;
                min-height: 100vh;
            }

            .logo {
                font-size: 50px;
                margin-bottom: 45px;
            }

            nav {
                gap: 16px;
            }

            nav a {
                font-size: 30px;
            }

            .secondary-menu {
                gap: 16px;
                padding-top: 35px;
            }

            .secondary-menu a {
                font-size: 30px;
            }

            .share {
                right: 35px;
                bottom: 30px;
            }

            .share button {
                font-size: 30px;
            }

            .share-menu {
                bottom: 45px;
            }

            .main {
                min-height: 50vh;
            }
        }
    </style>
</head>

<body>

    <div class="site">

        <header class="menu">

            <div class="logo">
                corpoarquivo.
            </div>

            <nav>
                <a href="#">texto</a>
                <a href="#">som</a>
                <a href="#">imagem</a>
                <a href="#">instalação</a>
                <a href="#">performance</a>
            </nav>

            <div class="secondary-menu">
                <a href="#">info</a>
                <a href="#">contacto</a>
            </div>

        </header>

        <main class="main">
        </main>

    </div>


    <!-- SHARE -->

    <div class="share">

        <button onclick="toggleShare()">
            share
        </button>

        <div class="share-menu" id="shareMenu">

            <a id="whatsapp" target="_blank">
                WhatsApp
            </a>

            <a id="facebook" target="_blank">
                Facebook
            </a>

            <a id="twitter" target="_blank">
                X
            </a>

            <a id="telegram" target="_blank">
                Telegram
            </a>

            <a id="email">
                Email
            </a>

            <button onclick="copyLink()">
                copiar link
            </button>

        </div>

    </div>


    <script>

        const pageURL = encodeURIComponent(window.location.href);
        const pageTitle = encodeURIComponent(document.title);


        document.getElementById("whatsapp").href =
            "https://wa.me/?text=" + pageTitle + "%20" + pageURL;


        document.getElementById("facebook").href =
            "https://www.facebook.com/sharer/sharer.php?u=" + pageURL;


        document.getElementById("twitter").href =
            "https://twitter.com/intent/tweet?url=" + pageURL + "&text=" + pageTitle;


        document.getElementById("telegram").href =
            "https://t.me/share/url?url=" + pageURL + "&text=" + pageTitle;


        document.getElementById("email").href =
            "mailto:?subject=" + pageTitle + "&body=" + pageURL;


        function toggleShare() {

            const menu = document.getElementById("shareMenu");

            menu.classList.toggle("active");

        }


        function copyLink() {

            navigator.clipboard.writeText(window.location.href);

            alert("Link copiado.");

        }

    </script>

</body>
</html>
