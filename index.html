<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>corpoarquivo.</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background: #dedfe1;
    color: #151515;
    font-family: "IBM Plex Mono", monospace;
}

.site {
    display: grid;
    grid-template-columns: 36% 64%;
    min-height: 100vh;
}

.menu {
    padding: 45px 100px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

button {
    font-family: inherit;
    color: inherit;
    cursor: pointer;
}

.logo-button,
.share-button,
.language-button,
.share-menu button {
    background: none;
    border: 0;
    padding: 0;
}

.logo-button {
    font-size: 60px;
    text-align: left;
    white-space: nowrap;
}

.logo-button:hover,
a:hover,
button:hover {
    text-decoration: underline;
}


/* MENU */

.main-menu,
.secondary-menu {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 18px;
}

.main-menu {
    margin-top: 30px;
    opacity: 0;
    transform: translateY(-12px);
    visibility: hidden;
    pointer-events: none;
    transition: .35s ease;
}

.main-menu.open {
    opacity: 1;
    transform: translateY(0);
    visibility: visible;
    pointer-events: auto;
}

.main-menu a,
.secondary-menu a {
    width: max-content;
    color: #151515;
    text-decoration: none;
    font-size: 28px;
    line-height: 1.25;
    white-space: nowrap;
}

.secondary-menu {
    margin-top: auto;
}


/* IMAGEM */

main {
    min-height: 100vh;
    padding: 45px 100px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.main-image {
    display: block;
    width: auto;
    height: auto;
    max-width: 65%;
    max-height: calc(100vh - 260px);
    object-fit: contain;

    /* PRETO E BRANCO */
    filter: grayscale(100%);
}


/* IDIOMAS */

.languages {
    position: fixed;
    top: 45px;
    right: 100px;
    display: flex;
    gap: 20px;
    z-index: 10;
}

.language-button {
    font-size: 18px;
}

.language-button.active {
    text-decoration: underline;
}


/* SHARE */

.share {
    position: fixed;
    right: 100px;
    bottom: 45px;
    z-index: 10;
}

.share-button {
    font-size: 28px;
}

.share-menu {
    display: none;
    position: absolute;
    right: 0;
    bottom: 45px;
    min-width: 190px;
    padding: 18px 22px;
    background: #dedfe1;
    border: 1px solid #151515;
    flex-direction: column;
    gap: 12px;
}

.share-menu.open {
    display: flex;
}

.share-menu a,
.share-menu button {
    color: #151515;
    font-size: 20px;
    text-align: left;
    text-decoration: none;
}


/* MOBILE */

@media (max-width: 700px) {

    .site {
        grid-template-columns: 1fr;
    }

    .menu {
        padding: 30px 35px;
    }

    .logo-button {
        font-size: 50px;
    }

    .main-menu a,
    .secondary-menu a {
        font-size: 24px;
        white-space: normal;
    }

    main {
        min-height: 70vh;
        padding: 30px 35px;
    }

    .main-image {
        max-width: 100%;
        max-height: 70vh;
    }

    .languages {
        top: 30px;
        right: 35px;
        gap: 12px;
    }

    .language-button {
        font-size: 14px;
    }

    .share {
        right: 35px;
        bottom: 30px;
    }

    .share-button {
        font-size: 24px;
    }
}

</style>
</head>

<body>

<div class="site">

    <header class="menu">

        <button class="logo-button" id="logoButton">
            corpoarquivo.
        </button>

        <nav class="main-menu" id="mainMenu">

            <a href="#" data-key="texto">texto</a>
            <a href="#" data-key="som">som</a>
            <a href="#" data-key="imagem">imagem</a>
            <a href="#" data-key="instalacao">instalação</a>
            <a href="#" data-key="performance">performance</a>

        </nav>

        <div class="secondary-menu">

            <a href="#" data-key="info">info</a>
            <a href="#" data-key="contacto">contacto</a>

        </div>

    </header>


    <main>

        <img
            class="main-image"
            src="imagens/imagem.png"
            alt=""
        >

    </main>

</div>


<!-- IDIOMAS -->

<div class="languages">

    <button
        class="language-button active"
        data-lang="pt"
    >
        PT
    </button>

    <button
        class="language-button"
        data-lang="en"
    >
        EN
    </button>

    <button
        class="language-button"
        data-lang="fr"
    >
        FR
    </button>

    <button
        class="language-button"
        data-lang="es"
    >
        ES
    </button>

</div>


<!-- SHARE -->

<div class="share">

    <button
        class="share-button"
        id="shareButton"
    >
        share
    </button>

    <div
        class="share-menu"
        id="shareMenu"
    >

        <a id="whatsapp" target="_blank">WhatsApp</a>
        <a id="facebook" target="_blank">Facebook</a>
        <a id="twitter" target="_blank">X</a>

        <button id="instagram">
            Instagram
        </button>

        <a id="telegram" target="_blank">Telegram</a>
        <a id="email">Email</a>

        <button id="copy">
            copiar link
        </button>

    </div>

</div>


<script>

const translations = {

    pt: {
        texto: "texto",
        som: "som",
        imagem: "imagem",
        instalacao: "instalação",
        performance: "performance",
        info: "info",
        contacto: "contacto"
    },

    en: {
        texto: "text",
        som: "sound",
        imagem: "image",
        instalacao: "installation",
        performance: "performance",
        info: "info",
        contacto: "contact"
    },

    fr: {
        texto: "texte",
        som: "son",
        imagem: "image",
        instalacao: "installation",
        performance: "performance",
        info: "info",
        contacto: "contact"
    },

    es: {
        texto: "texto",
        som: "sonido",
        imagem: "imagen",
        instalacao: "instalación",
        performance: "performance",
        info: "info",
        contacto: "contacto"
    }

};


/* MENU */

logoButton.onclick = () => {
    mainMenu.classList.toggle("open");
};


/* IDIOMAS */

document
    .querySelectorAll(".language-button")
    .forEach(button => {

        button.onclick = () => {

            const lang = button.dataset.lang;

            document
                .querySelectorAll("[data-key]")
                .forEach(el => {
                    el.textContent =
                        translations[lang][el.dataset.key];
                });

            document
                .querySelectorAll(".language-button")
                .forEach(b => {
                    b.classList.toggle(
                        "active",
                        b === button
                    );
                });

            document.documentElement.lang = lang;
        };

    });


/* SHARE */

shareButton.onclick = () => {
    shareMenu.classList.toggle("open");
};


/* PARTILHA */

const url = encodeURIComponent(location.href);
const title = encodeURIComponent(document.title);

whatsapp.href =
    `https://wa.me/?text=${title}%20${url}`;

facebook.href =
    `https://www.facebook.com/sharer/sharer.php?u=${url}`;

twitter.href =
    `https://twitter.com/intent/tweet?url=${url}&text=${title}`;

telegram.href =
    `https://t.me/share/url?url=${url}&text=${title}`;

email.href =
    `mailto:?subject=${title}&body=${url}`;


/* INSTAGRAM */

instagram.onclick = () => {

    navigator.clipboard.writeText(location.href);

    window.open(
        "https://www.instagram.com/",
        "_blank"
    );

};


/* COPIAR LINK */

copy.onclick = () => {

    navigator.clipboard.writeText(location.href);

    alert("Link copiado.");

};

</script>

</body>
</html>
