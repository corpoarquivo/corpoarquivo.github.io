<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>corpoarquivo.</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #dedfe1;
            color: #151515;
            font-family: Georgia, "Times New Roman", serif;
        }

        .site {
            display: grid;
            grid-template-columns: 28% 72%;
            min-height: 100vh;
        }

        /* COLUNA ESQUERDA */

        .menu {
            padding: 45px 100px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* LOGO */

        .logo {
            font-size: 60px;
            font-weight: normal;
            margin-bottom: 65px;
        }

        /* MENU PRINCIPAL */

        nav {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        nav a {
            color: #151515;
            text-decoration: none;
            font-size: 36px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* MENU INFERIOR */

        .secondary-menu {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .secondary-menu a {
            color: #151515;
            text-decoration: none;
            font-size: 36px;
        }

        .secondary-menu a:hover {
            text-decoration: underline;
        }

        /* ÁREA PRINCIPAL */

        main {
            min-height: 100vh;
            padding: 45px 100px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* IMAGEM */

        .main-image {
            display: block;
            max-width: 100%;
            max-height: calc(100vh - 90px);
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* SHARE */

        .share {
            position: fixed;
            right: 100px;
            bottom: 45px;
            z-index: 1000;
        }

        .share-button {
            background: none;
            border: none;
            padding: 0;
            margin: 0;

            color: #151515;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 36px;

            cursor: pointer;
        }

        .share-button:hover {
            text-decoration: underline;
        }

        /* MENU SHARE */

        .share-menu {
            display: none;

            position: absolute;
            right: 0;
            bottom: 55px;

            min-width: 190px;

            background: #dedfe1;
            border: 1px solid #151515;

            padding: 18px 22px;
        }

        .share-menu.open {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .share-menu a,
        .share-menu button {
            background: none;
            border: none;
            padding: 0;

            color: #151515;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 20px;

            text-decoration: none;
            text-align: left;

            cursor: pointer;
        }

        .share-menu a:hover,
        .share-menu button:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <div class="site">

        <header class="menu">

            <div class="logo">
                corpoarquivo.
            </div>

            <nav>
                <a href="#">texto</a>
                <a href="#">som</a>
                <a href="#">imagem</a>
                <a href="#">instalação</a>
                <a href="#">performance</a>
            </nav>

            <div class="secondary-menu">
                <a href="#">info</a>
                <a href="#">contacto</a>
            </div>

        </header>


        <main>

            <img
                class="main-image"
                src="imagens/imagem.png"
                alt=""
            >

        </main>

    </div>


    <!-- SHARE -->

    <div class="share">

        <button class="share-button" onclick="toggleShare()">
            share
        </button>

        <div class="share-menu" id="shareMenu">

            <a id="whatsapp" target="_blank">WhatsApp</a>

            <a id="facebook" target="_blank">Facebook</a>

            <a id="twitter" target="_blank">X</a>

            <button onclick="shareInstagram()">
                Instagram
            </button>

            <a id="telegram" target="_blank">Telegram</a>

            <a id="email">Email</a>

            <button onclick="copyLink()">
                copiar link
            </button>

        </div>

    </div>


    <script>

        function toggleShare() {

            const menu = document.getElementById("shareMenu");

            menu.classList.toggle("open");

        }


        const url = encodeURIComponent(window.location.href);
        const title = encodeURIComponent(document.title);


        document.getElementById("whatsapp").href =
            "https://wa.me/?text=" + title + "%20" + url;


        document.getElementById("facebook").href =
            "https://www.facebook.com/sharer/sharer.php?u=" + url;


        document.getElementById("twitter").href =
            "https://twitter.com/intent/tweet?url=" + url + "&text=" + title;


        document.getElementById("telegram").href =
            "https://t.me/share/url?url=" + url + "&text=" + title;


        document.getElementById("email").href =
            "mailto:?subject=" + title + "&body=" + url;


        function shareInstagram() {

            navigator.clipboard.writeText(window.location.href);

            window.open(
                "https://www.instagram.com/",
                "_blank"
            );

        }


        function copyLink() {

            navigator.clipboard.writeText(window.location.href);

            alert("Link copiado.");

        }

    </script>

</body>
</html>
