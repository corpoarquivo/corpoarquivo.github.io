<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>corpoarquivo.</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #dedfe1;
            color: #151515;
            font-family: Georgia, "Times New Roman", serif;
        }

        .site {
            display: grid;
            grid-template-columns: 28% 72%;
            min-height: 100vh;
        }

        /* MENU */

        .menu {
            padding: 45px 100px;
            position: relative;
            min-height: 100vh;
        }

        .logo {
            font-size: 60px;
            font-weight: normal;
            margin-bottom: 65px;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        nav a {
            color: #151515;
            text-decoration: none;
            font-size: 36px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* MENU INFERIOR */

        .secondary-menu {
            position: absolute;
            left: 100px;
            bottom: 45px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .secondary-menu a {
            color: #151515;
            text-decoration: none;
            font-size: 36px;
        }

        .secondary-menu a:hover {
            text-decoration: underline;
        }

        /* ÁREA PRINCIPAL */

        .main {
            min-height: 100vh;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .site {
                grid-template-columns: 1fr;
            }

            .menu {
                padding: 30px 35px;
                min-height: 100vh;
            }

            .logo {
                font-size: 50px;
                margin-bottom: 45px;
            }

            nav {
                gap: 16px;
            }

            nav a {
                font-size: 30px;
            }

            .secondary-menu {
                left: 35px;
                bottom: 30px;
                gap: 16px;
            }

            .secondary-menu a {
                font-size: 30px;
            }

            .main {
                min-height: 50vh;
            }
        }
    </style>
</head>

<body>

    <div class="site">

        <header class="menu">

            <div class="logo">
                corpoarquivo.
            </div>

            <nav>
                <a href="#">texto</a>
                <a href="#">som</a>
                <a href="#">imagem</a>
                <a href="#">instalação</a>
                <a href="#">performance</a>
            </nav>

            <div class="secondary-menu">
                <a href="#">info</a>
                <a href="#">contacto</a>
            </div>

        </header>

        <main class="main">
        </main>

    </div>

</body>
</html>
