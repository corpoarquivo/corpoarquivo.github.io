<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>corpoarquivo.</title>

<link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background: #dedfe1;
    color: #151515;
    font-family: "IBM Plex Mono", monospace;
}

.site {
    display: grid;
    grid-template-columns: 36% 64%;
    min-height: 100vh;
}


/* MENU */

.menu {
    padding: 45px 100px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}


/* LOGO */

.logo-button,
.share-button {
    background: none;
    border: 0;
    padding: 0;
    color: #151515;
    font: inherit;
    cursor: pointer;
}

.logo-button {
    font-size: 60px;
    text-align: left;
    white-space: nowrap;
}

.logo-button:hover,
.main-menu a:hover,
.secondary-menu a:hover,
.share-button:hover,
.share-menu a:hover,
.share-menu button:hover,
.language-button:hover {
    text-decoration: underline;
}


/* MENU POP-UP */

.main-menu {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 18px;

    margin-top: 30px;

    opacity: 0;
    transform: translateY(-12px);

    visibility: hidden;
    pointer-events: none;

    transition:
        opacity .35s ease,
        transform .35s ease;
}

.main-menu.open {
    opacity: 1;
    transform: translateY(0);

    visibility: visible;
    pointer-events: auto;
}

.main-menu a,
.secondary-menu a {
    display: block;
    width: max-content;

    color: #151515;
    text-decoration: none;

    font-size: 36px;
    line-height: 1.25;

    white-space: nowrap;
}


/* INFO / CONTACTO */

.secondary-menu {
    margin-top: auto;

    display: flex;
    flex-direction: column;
    gap: 18px;
}


/* IMAGEM */

main {
    min-height: 100vh;

    padding: 45px 100px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.main-image {
    display: block;

    width: auto;
    height: auto;

    max-width: 65%;
    max-height: calc(100vh - 260px);

    object-fit: contain;
}


/* IDIOMAS */

.languages {
    position: fixed;

    top: 45px;
    right: 100px;

    display: flex;
    gap: 20px;

    z-index: 10;
}

.language-button {
    background: none;
    border: 0;

    padding: 0;

    color: #151515;

    font-family: "IBM Plex Mono", monospace;
    font-size: 18px;

    cursor: pointer;
}

.language-button.active {
    text-decoration: underline;
}


/* SHARE */

.share {
    position: fixed;

    right: 100px;
    bottom: 45px;

    z-index: 10;
}

.share-button {
    font-size: 36px;
}


/* MENU SHARE */

.share-menu {
    display: none;

    position: absolute;

    right: 0;
    bottom: 55px;

    min-width: 190px;

    padding: 18px 22px;

    background: #dedfe1;
    border: 1px solid #151515;
}

.share-menu.open {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.share-menu a,
.share-menu button {
    background: none;
    border: 0;

    padding: 0;

    color: #151515;

    font: 20px "IBM Plex Mono", monospace;

    text-align: left;
    text-decoration: none;

    cursor: pointer;
}


/* MOBILE */

@media (max-width: 700px) {

    .site {
        grid-template-columns: 1fr;
    }

    .menu {
        padding: 30px 35px;
    }

    .logo-button {
        font-size: 50px;
    }

    .main-menu a,
    .secondary-menu a {
        font-size: 30px;
        white-space: normal;
    }

    main {
        min-height: 70vh;
        padding: 30px 35px;
    }

    .main-image {
        max-width: 100%;
        max-height: 70vh;
    }

    .languages {
        top: 30px;
        right: 35px;
        gap: 12px;
    }

    .language-button {
        font-size: 14px;
    }

    .share {
        right: 35px;
        bottom: 30px;
    }

    .share-button {
        font-size: 30px;
    }
}

</style>
</head>


<body>


<div class="site">


    <header class="menu">


        <!-- LOGO -->

        <button
            class="logo-button"
            id="logoButton"
        >
            corpoarquivo.
        </button>


        <!-- MENU -->

        <nav
            class="main-menu"
            id="mainMenu"
        >

            <a
                href="#"
                data-key="texto"
            >
                texto
            </a>

            <a
                href="#"
                data-key="som"
            >
                som
            </a>

            <a
                href="#"
                data-key="imagem"
            >
                imagem
            </a>

            <a
                href="#"
                data-key="instalacao"
            >
                instalação
            </a>

            <a
                href="#"
                data-key="performance"
            >
                performance
            </a>

        </nav>


        <!-- INFO / CONTACTO -->

        <div class="secondary-menu">

            <a
                href="#"
                data-key="info"
            >
                info
            </a>

            <a
                href="#"
                data-key="contacto"
            >
                contacto
            </a>

        </div>


    </header>


    <!-- IMAGEM -->

    <main>

        <img
            class="main-image"
            src="imagens/imagem.png"
            alt=""
        >

    </main>


</div>


<!-- IDIOMAS -->

<div class="languages">

    <button
        class="language-button active"
        data-lang="pt"
    >
        Português
    </button>

    <button
        class="language-button"
        data-lang="en"
    >
        English
    </button>

    <button
        class="language-button"
        data-lang="fr"
    >
        Français
    </button>

    <button
        class="language-button"
        data-lang="es"
    >
        Español
    </button>

</div>


<!-- SHARE -->

<div class="share">

    <button
        class="share-button"
        id="shareButton"
    >
        share
    </button>


    <div
        class="share-menu"
        id="shareMenu"
    >

        <a
            id="whatsapp"
            target="_blank"
        >
            WhatsApp
        </a>

        <a
            id="facebook"
            target="_blank"
        >
            Facebook
        </a>

        <a
            id="twitter"
            target="_blank"
        >
            X
        </a>

        <button id="instagram">
            Instagram
        </button>

        <a
            id="telegram"
            target="_blank"
        >
            Telegram
        </a>

        <a id="email">
            Email
        </a>

        <button id="copy">
            copiar link
        </button>

    </div>

</div>


<script>


/* TRADUÇÕES */

const translations = {

    pt: {
        texto: "texto",
        som: "som",
        imagem: "imagem",
        instalacao: "instalação",
        performance: "performance",
        info: "info",
        contacto: "contacto"
    },

    en: {
        texto: "text",
        som: "sound",
        imagem: "image",
        instalacao: "installation",
        performance: "performance",
        info: "info",
        contacto: "contact"
    },

    fr: {
        texto: "texte",
        som: "son",
        imagem: "image",
        instalacao: "installation",
        performance: "performance",
        info: "info",
        contacto: "contact"
    },

    es: {
        texto: "texto",
        som: "sonido",
        imagem: "imagen",
        instalacao: "instalación",
        performance: "performance",
        info: "info",
        contacto: "contacto"
    }

};


/* MENU */

document.getElementById("logoButton").onclick = () => {

    document
        .getElementById("mainMenu")
        .classList
        .toggle("open");

};


/* IDIOMAS */

document
    .querySelectorAll(".language-button")
    .forEach(button => {

        button.onclick = () => {

            const lang = button.dataset.lang;


            document
                .querySelectorAll("[data-key]")
                .forEach(element => {

                    element.textContent =
                        translations[lang][
                            element.dataset.key
                        ];

                });


            document
                .querySelectorAll(".language-button")
                .forEach(b => {

                    b.classList.remove("active");

                });


            button.classList.add("active");

            document.documentElement.lang = lang;

        };

    });


/* SHARE */

const shareButton =
    document.getElementById("shareButton");

const shareMenu =
    document.getElementById("shareMenu");


shareButton.onclick = () => {

    shareMenu.classList.toggle("open");

};


/* LINKS */

const url =
    encodeURIComponent(
        window.location.href
    );

const title =
    encodeURIComponent(
        document.title
    );


document.getElementById("whatsapp").href =
    `https://wa.me/?text=${title}%20${url}`;


document.getElementById("facebook").href =
    `https://www.facebook.com/sharer/sharer.php?u=${url}`;


document.getElementById("twitter").href =
    `https://twitter.com/intent/tweet?url=${url}&text=${title}`;


document.getElementById("telegram").href =
    `https://t.me/share/url?url=${url}&text=${title}`;


document.getElementById("email").href =
    `mailto:?subject=${title}&body=${url}`;


/* INSTAGRAM */

document.getElementById("instagram").onclick = () => {

    navigator.clipboard.writeText(
        window.location.href
    );

    window.open(
        "https://www.instagram.com/",
        "_blank"
    );

};


/* COPIAR */

document.getElementById("copy").onclick = () => {

    navigator.clipboard.writeText(
        window.location.href
    );

    alert("Link copiado.");

};

</script>

</body>
</html>
